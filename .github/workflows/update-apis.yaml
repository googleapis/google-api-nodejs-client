on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: gh repo fork googleapis/google-api-nodejs-client --fork-name google-api-nodejs-client-autodisco --clone
        env:
          GH_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
      - run: |
          git remote add upstream https://github.com/googleapis/google-api-nodejs-client.git 2>/dev/null || true
          git fetch upstream main
          git checkout -B main upstream/main
        working-directory: ./google-api-nodejs-client-autodisco
      - run: npm install
        working-directory: ./google-api-nodejs-client-autodisco
      - run: npm run update-disclaimers
        working-directory: ./google-api-nodejs-client-autodisco
      - run: npm run submit-prs
        working-directory: ./google-api-nodejs-client-autodisco
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE_BOT_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
